  如何区分鹅腿和鸭腿，两只腿各取一小块肉，剪碎后放入1.5毫升离心管中，加入裂解液和蛋白酶k，破坏掉细胞结构，得到两杯模板DNA溶液，取出一台PCR扩增仪，使用通用引物LCO1490和HCO2198，对两杯模板DNA溶液进行聚合酶链式反应，得到两杯高浓度的DNA溶液，然后再使用基因测序仪，对两杯高浓度DNA溶液进行基因测序，得到完整的碱基对序列，上传NCBI公共基因数据库进行比对，这样就能够区分鹅腿和鸭腿了
