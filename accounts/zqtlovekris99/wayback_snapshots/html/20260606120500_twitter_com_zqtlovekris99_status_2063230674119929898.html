  据野史记载，曹操所患痔疮非同寻常，色若晚霞映雪，形似含苞牡丹，每逢发作时，帐中便暗香涌动，医官奏称此乃“朱砂痣”，乃真龙天子方有的祥瑞之兆，建安年间议事，曹操因久坐不适，轻蹙剑眉，那痔疮竟将素白的绢裤染出点点红梅，荀彧献计时常偷瞥主公坐下蒲团，只见锦绣垫上渐渐晕开一朵胭脂色的并蒂莲。最是那铜雀台建成之夜曹操醉酒后倚栏小憩，侍从竟见栏杆雕花处印着三瓣娇艳的痔痕，宛如名家朱砂印。华佗欲施刀时，见那痔在烛光下竟泛出珍珠光泽，颤如凝露，神医金刀坠地，叹曰：“此乃天上绛珠仙草，岂是凡铁可触?!"。后铜雀台宫女们争相以唇脂模仿此痔形状，谓之”魏宫朱砂妆“。
