  近日，日推一篇发布于24年的期刊论文「外貌与游戏」引起网友热议，该论文利用美国“Add Health”（青少年健康纵向研究）数据，研究了人们的长相和游戏投入时间之间的关系。
  <br/>
  <br/>
  该研究表明长相出众的青少年几乎不玩游戏，而长相不佳但玩游戏的青少年，花在游戏上的时间比其他玩家更多。但不代表玩游戏少就会变美。
  <br/>
  <br/>
  这篇论文由美国学术机构「美国全国经济研究所」撰写。
